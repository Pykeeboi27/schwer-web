repos:
  # 1. Basic File Hygiene (Same as Python)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json

  # 2. Prettier (Code Formatting)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json, css, scss, markdown]

  # 3. ESLint (Linting)
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        files: \.[jt]sx?$ # Targets .js, .jsx, .ts, .tsx
        types: [file]
        additional_dependencies:
          - eslint@8.56.0
          - typescript@latest
          - "@typescript-eslint/parser@latest"
          - "@typescript-eslint/eslint-plugin@latest"
        args: [--fix]

  # 4. Gitleaks (Secrets Detection - Same as Python)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.1
    hooks:
      - id: gitleaks

  # 5. Trivy (Dependency Scan)
  - repo: local
    hooks:
      - id: trivy
        name: Trivy Security Scan
        language: docker_image
        entry: ghcr.io/aquasecurity/trivy:latest
        stages: [pre-push]
        args: ["fs", ".", "--severity", "HIGH,CRITICAL", "--exit-code", "1", "--scanners", "vuln,misconfig,secret"]
        pass_filenames: false
